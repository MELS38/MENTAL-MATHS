
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mental Maths — Mobile</title>
<meta name="theme-color" content="#0b1020">
<style>
:root{
  --bg1:#0b1020; --bg2:#121a33; --text:#e8eefc; --muted:#9bb0d1;
  --accent:#4cc3ff; --accent2:#8b79ff; --ok:#2ecc71; --err:#ff5c6c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100svh;color:var(--text);background:linear-gradient(180deg,var(--bg1),var(--bg2));-webkit-text-size-adjust:100%;font-family:-apple-system,system-ui,Segoe UI,Roboto,Helvetica,Arial}
/* Top app bar */
.appbar{
  position:fixed; inset:0 0 auto 0; height:56px; padding:0 clamp(10px,4vw,16px);
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  background:linear-gradient(180deg,rgba(0,0,0,.4),transparent);
  z-index:20; padding-top:env(safe-area-inset-top);
}
.appbar .title{font-weight:800; letter-spacing:.5px}
.iconbtn{
  -webkit-tap-highlight-color:transparent; border:0; background:rgba(255,255,255,.06);
  color:var(--text); width:40px; height:40px; border-radius:12px; display:grid; place-items:center;
}
/* Center display */
.main{
  display:grid; place-items:center; text-align:center;
  min-height: 70svh; padding: 80px 16px 120px 16px;
}
.big{
  font-weight:900; line-height:1; letter-spacing:-0.02em;
  font-size: clamp(64px, 16vw, 120px);
  text-shadow: 0 10px 30px rgba(0,0,0,.35);
}
.progress{
  position:absolute; left:0; right:0; bottom:120px;
  height:10px; border-radius:8px; overflow:hidden; margin:0 16px;
  background:rgba(255,255,255,.08);
}
.progress .bar{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .2s ease}
/* Bottom input bar */
.inputbar{
  position:fixed; inset:auto 0 0 0; z-index:15;
  background:rgba(10,15,30,.75); backdrop-filter: blur(12px) saturate(1.2);
  border-top:1px solid rgba(255,255,255,.08);
  padding: 12px clamp(12px,4vw,16px) calc(12px + env(safe-area-inset-bottom)) clamp(12px,4vw,16px);
  display:grid; grid-template-columns: 1fr auto; gap:10px;
}
.inputbar input{
  width:100%; min-height:48px; border-radius:12px; border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.06); color:var(--text); padding:0 14px; font-size:18px;
}
.inputbar button{
  min-height:48px; padding:0 18px; border:0; border-radius:12px; font-weight:800; color:#08111f;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
}
/* Settings sheet (slide from right) */
.sheet{
  position:fixed; inset:0 0 0 auto; width:min(92vw,420px); background:#0f1730; color:var(--text);
  box-shadow:-10px 0 30px rgba(0,0,0,.45);
  transform:translateX(100%); transition: transform .28s cubic-bezier(.22,.8,.36,1);
  z-index:30; padding: calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)) 16px;
  display:flex; flex-direction:column; gap:16px;
}
.sheet.open{ transform:translateX(0); }
.sheet h2{margin:6px 0 4px; font-size:18px; opacity:.9}
.row{display:flex; align-items:center; justify-content:space-between; gap:12px}
.value{opacity:.8; font-variant-numeric:tabular-nums}
.range{width:100%}
.toggle{display:flex; align-items:center; gap:12px}
hr{border:0; border-top:1px solid rgba(255,255,255,.08); margin:8px 0}
/* Buttons common */
.btn{min-height:44px; border:0; border-radius:12px; padding:10px 14px; font-weight:700}
.btn.ghost{background:rgba(255,255,255,.06); color:var(--text)}
/* State badges */
.badge{display:inline-block; padding:4px 10px; border-radius:999px; background:rgba(255,255,255,.08); font-size:12px}
/* Prevent layout shift when keyboard opens */
@supports (height: 100dvh){
  .main{ min-height: calc(100dvh - 176px); }
}
</style>
</head>
<body>
<div class="appbar">
  <div class="title">Mental&nbsp;Maths</div>
  <button class="iconbtn" id="btnSettings" aria-label="Réglages">⚙️</button>
</div>

<main class="main">
  <div class="big" id="display">Prêt&nbsp;?</div>
  <div class="progress"><div class="bar" id="progressBar"></div></div>
</main>

<div class="inputbar">
  <input id="answer" inputmode="numeric" pattern="[0-9\-]*" placeholder="Entre la somme…" autocomplete="off">
  <button id="validate">Valider</button>
</div>

<!-- Settings sheet -->
<aside class="sheet" id="sheet">
  <div class="row">
    <h2>Paramètres</h2>
    <span class="badge" id="preset">Normal</span>
  </div>
  <div class="row">
    <label>Nombre de chiffres</label>
    <span class="value" id="digitsVal">10</span>
  </div>
  <input id="digits" class="range" type="range" min="3" max="20" step="1" value="10">
  <div class="row">
    <label>Vitesse (ms/chiffre)</label>
    <span class="value" id="speedVal">800</span>
  </div>
  <input id="speed" class="range" type="range" min="150" max="1500" step="50" value="800">
  <div class="toggle">
    <input id="includeZero" type="checkbox" checked>
    <label for="includeZero">Inclure 0</label>
  </div>
  <div class="toggle">
    <input id="haptics" type="checkbox" checked>
    <label for="haptics">Haptics</label>
  </div>
  <hr>
  <div class="row">
    <button class="btn ghost" id="btnStart">Démarrer</button>
    <button class="btn ghost" id="btnClose">Fermer</button>
  </div>
</aside>

<script>
// --- State ---
const el = {
  display: document.getElementById('display'),
  bar: document.getElementById('progressBar'),
  answer: document.getElementById('answer'),
  validate: document.getElementById('validate'),
  digits: document.getElementById('digits'),
  digitsVal: document.getElementById('digitsVal'),
  speed: document.getElementById('speed'),
  speedVal: document.getElementById('speedVal'),
  includeZero: document.getElementById('includeZero'),
  preset: document.getElementById('preset'),
  sheet: document.getElementById('sheet'),
  btnSettings: document.getElementById('btnSettings'),
  btnClose: document.getElementById('btnClose'),
  btnStart: document.getElementById('btnStart'),
};

let sequence = [];
let target = 0;
let idx = 0;
let timer = null;
let phase = 'idle'; // idle | showing | answer

// --- UI helpers ---
function openSheet(){ el.sheet.classList.add('open'); }
function closeSheet(){ el.sheet.classList.remove('open'); }
el.btnSettings.addEventListener('click', openSheet);
el.btnClose.addEventListener('click', closeSheet);

function setPreset(){
  const v = +el.speed.value;
  const tag = v<=300?'Turbo':v<=550?'Rapide':v<=950?'Normal':'Chill';
  el.preset.textContent = tag;
}
el.speed.addEventListener('input', ()=>{ el.speedVal.textContent = el.speed.value; setPreset(); });
el.digits.addEventListener('input', ()=>{ el.digitsVal.textContent = el.digits.value; });

// --- Haptics ---
function haptic(type='light'){
  if (window.webkit?.messageHandlers?.haptic) {
    try { window.webkit.messageHandlers.haptic.postMessage(type); } catch(e){}
  }
}

// --- Game logic ---
function generateDigits(n, includeZero){
  const arr=[];
  while(arr.length<n){
    let x = Math.floor(Math.random()*19)-9; // -9..9
    if(!includeZero && x===0) continue;
    if(includeZero && x===0 && arr.at(-1)===0) continue;
    arr.push(x);
  }
  return arr;
}

function startGame(){
  closeSheet();
  el.answer.value='';
  phase='showing';
  sequence = generateDigits(+el.digits.value, el.includeZero.checked);
  target = sequence.reduce((a,b)=>a+b,0);
  idx = 0;
  el.bar.style.width = '0%';
  step();
}

function step(){
  if(phase!=='showing') return;
  if(idx < sequence.length){
    const n = sequence[idx++];
    el.display.textContent = n>=0 ? String(n) : '−'+Math.abs(n);
    el.bar.style.width = `${Math.floor(idx/sequence.length*100)}%`;
    timer = setTimeout(step, +el.speed.value);
  } else {
    phase='answer';
    el.display.textContent = '?';
    el.bar.style.width = '100%';
    el.answer.focus();
  }
}

function validate(){
  const a = parseInt(el.answer.value.replace('−','-'),10) || 0;
  const ok = a===target;
  el.display.textContent = ok? '✔︎' : String(target);
  el.display.style.color = ok? 'var(--ok)':'var(--err)';
  haptic(ok?'success':'error');
  setTimeout(()=>{
    el.display.style.color = 'var(--text)';
  }, 600);
}

el.validate.addEventListener('click', validate);
el.answer.addEventListener('keydown', e=>{ if(e.key==='Enter'){ validate(); }});
el.btnStart.addEventListener('click', startGame);

// defaults
el.digitsVal.textContent=el.digits.value;
el.speedVal.textContent=el.speed.value;
setPreset();
</script>
</body>
</html>
